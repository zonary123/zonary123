name: TryHackMe Update Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
jobs:
  tryhackme-badge-update:
    name: Update this repo's tryhackme badge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate TryHackMe Badge
        uses: KeizerSec/Tryhackme-Badge@main
        with:
          username: 'zonary123'
          theme: 'midnight'

      - name: Commit and push badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tryhackme.svg
          git commit -m "Update TryHackMe badge [skip ci]" || exit 0
          git push
